<!DOCTYPE html>
<html lang="en">

<head>
    <!-- <meta charset="UTF-8"> -->
    <!-- <meta name="viewport" content="width=device-width, initial-scale=1.0"> -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bitcount+Grid+Double:wght@100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer ></script>
    <title>Tic Tac Toe</title>
</head>
<body>
    <img class="header_banner" src="assests/images/Header.svg" alt="header">
    <div class="button_container">
        <button class="mode_button" id="mode1">SINGLE USER </button>
        <button class="mode_button" id="mode2">DUAL USER </button>
    </div>

    <div class="board_ttc">
        <div class="board_grid" data-index="0"></div>
        <div class="board_grid" data-index="1"></div>
        <div class="board_grid" data-index="2"></div>
        <div class="board_grid" data-index="3"></div>
        <div class="board_grid" data-index="4"></div>
        <div class="board_grid" data-index="5"></div>
        <div class="board_grid" data-index="6"></div>
        <div class="board_grid" data-index="7"></div>
        <div class="board_grid" data-index="8"></div>
    </div>
    <div class="footer_button">
        <button class="restart_button" id="restart"> RESTART</button>
    </div>
</body>
</html>
