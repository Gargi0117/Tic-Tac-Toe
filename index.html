<!DOCTYPE html>
<html lang="en">

<head>
    <!-- <meta charset="UTF-8"> -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bitcount+Grid+Double:wght@100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="script.js" defer ></script>
    <title>Tic Tac Toe</title>
</head>
<body>
    <img class="header_banner" src="assests/images/Header.svg" alt="header">
    <div class="button_container">
        <button class="mode_button" id="mode1">SINGLE USER </button>
        <button class="mode_button" id="mode2">DUAL USER </button>
    </div>

    <div class="msg_container hide">
        <p id="msg">Winner</p>
    </div>
    <div class="board_ttc">
        <button class="cell"></button>
        <button class="cell"></button>
        <button class="cell" data-index="2"></button>
        <button class="cell" data-index="3"></button>
        <button class="cell" data-index="4"></button>
        <button class="cell" data-index="5"></button>
        <button class="cell" data-index="6"></button>
        <button class="cell" data-index="7"></button>
        <button class="cell" data-index="8"></button>
    </div>
    <div class="footer_button">
        <button class="restart_button" id="restart"> RESTART</button>
        <button class="new_button hide">New Game</button>
    </div>
</body>
</html>
